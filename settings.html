<html lang="ta">
<head>

<meta charset="UTF-8">

      content="width=device-width,

               user-scalable=no,

<title>ERP Master Settings</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#030712;
    color:#1E2B23;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
}

button,
input,
select,
textarea{
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

.container{
    width:100%;
    max-width:900px;
    background:#fff;
    padding:16px;
    border-radius:18px;
    border:1px solid rgba(82,110,81,.15);
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow:hidden;
}

.top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:11px;
    background:#1A2421;
    padding:9px 13px;
    border-radius:8px;
    min-height:38px;
}

.system-config{
    font-size:11px;
    font-weight:700;
    color:#4A7C59;
    text-transform:uppercase;
}

.page-title{
    font-size:18px;
    font-weight:800;
    color:#2F4F38;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.4px;
    border-bottom:2px solid #EAF0EA;
    padding-bottom:11px;
}

.form-section{
    background:#F8FAF8;
    border:1px solid #E2E8E2;
    border-radius:13px;
    padding:21px 13px 14px;
    position:relative;
    overflow:hidden;
}

.section-badge{
    position:absolute;
    top:0;
    left:12px;
    transform:translateY(-1px);
    background:#4A7C59;
    color:#fff;
    font-size:9px;
    font-weight:700;
    padding:5px 10px;
    border-radius:0 0 9px 9px;
    letter-spacing:.3px;
    text-transform:uppercase;
}

.section-badge.blue{
    background:#2563EB;
}

.section-badge.amber{
    background:#D97706;
}

.section-badge.danger{
    background:#DC2626;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:9px;
    min-width:0;
}

.form-group label{
    font-size:11px;
    font-weight:700;
    color:#4A554A;
}

input,
select,
textarea{
    width:100%;
    min-width:0;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid #D1DED1;
    background:#fff;
    color:#1E2B23;
    font-size:12px;
    font-weight:600;
    outline:none;
    appearance:auto;
}

textarea{
    resize:vertical;
    min-height:80px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#4A7C59;
    box-shadow:0 0 0 2px rgba(74,124,89,.12);
}

.checkbox-group-container{
    background:#fff;
    border:1px solid #D1DED1;
    border-radius:9px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:5px;
    max-height:260px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.checkbox-item{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:11px;
    font-weight:600;
    color:#1E2B23;
    cursor:pointer;
    min-height:28px;
}

.checkbox-item input[type=checkbox]{
    width:18px;
    height:18px;
    flex:0 0 18px;
    accent-color:#EF4444;
}

.users-table-container{
    margin-top:13px;
    background:#fff;
    border-radius:9px;
    overflow-x:auto;
    border:1px solid #D1DED1;
    -webkit-overflow-scrolling:touch;
}

.users-table{
    width:100%;
    min-width:480px;
    border-collapse:collapse;
    font-size:10px;
    text-align:center;
}

.users-table th,
.users-table td{
    padding:9px;
    border-bottom:1px solid #E2E8E2;
    color:#1E2B23;
}

.users-table th{
    background:#EAF0EA;
    color:#2F4F38;
    font-weight:700;
    text-transform:uppercase;
}

input[type=file]{
    padding:7px;
    background:#F4F7F4;
    border:1px dashed #4A7C59;
    cursor:pointer;
}

input[type=file]::file-selector-button{

    color:#fff;
    border:0;
    padding:6px 10px;
    border-radius:6px;
    font-weight:600;

.preview-box{

    justify-content:center;

}

.preview-box img{

    width:auto;
    height:auto;
    max-height:110px;

    border-radius:5px;
}

.logo-status{
    margin-top:6px;
    font-size:10px;
    font-weight:600;
    text-align:center;
    color:#4A7C59;
}

#advancedJsonEditor{
    width:100%;
    height:180px;
    background:#111827;
    color:#A7F3D0;
    font-family:monospace;
    font-size:10px;
    padding:12px;
    border-radius:9px;
    border:1px solid #064E3B;
    resize:vertical;
}

.btn-action{
    color:#fff;
    border:0;
    padding:11px 14px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:10px;
    box-shadow:0 3px 8px rgba(0,0,0,.10);
    text-transform:uppercase;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-decoration:none;
    text-align:center;
    min-height:40px;

}

.btn-action:active{

}

.btn-action:disabled{

}

.btn-primary{
    background:#2F4F38;
    font-size:12px;
    padding:13px;

}

.btn-success{

}

.btn-info{
    background:#2563EB;
}

.btn-warning{
    background:#D97706;
}

.btn-danger{
    background:#DC2626;
}

.action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;

}

#settingsStatus{

    text-align:center;
    font-weight:700;
    color:#2563EB;
    min-height:15px;

.save-progress{
    display:none;

    font-size:10px;
    font-weight:700;
    color:#2563EB;

}

#customToast{

.mobile-note{

@media(max-width:600px){

    }

</style>

<script>

"use strict";

/* ============================================================
   TEXFRIEND ERP SETTINGS
   MOBILE SAFE / LOCAL FIRST / CLOUD TIMEOUT
============================================================ */

let tempLogoData = "";
let tempDesignBitmapData = "";
let settingsInitialized = false;
let saveAllRunning = false;
let cloudSyncHandled = false;


/* ============================================================
   LIMITS
============================================================ */

const LOGO_MAX_WIDTH = 512;
const LOGO_MAX_HEIGHT = 512;

const DESIGN_MAX_WIDTH = 800;
const DESIGN_MAX_HEIGHT = 800;

const MAX_IMAGE_BYTES = 300 * 1024;

const CLOUD_TIMEOUT = 7000;

const MAX_EDITOR_BYTES = 1500000;


/* ============================================================
   HELPER
============================================================ */

function $(id){
    return document.getElementById(id);
}


/* ============================================================
   STATUS
============================================================ */

function status(message, ok=true){

    const el = $("settingsStatus");

    if(!el) return;

    el.textContent = String(message);

    el.style.color =
        ok ? "#2563EB" : "#DC2626";
}


/* ============================================================
   SAVE PROGRESS
============================================================ */

function saveProgress(message){

    const el = $("saveProgress");

    if(!el) return;

    el.style.display = "block";
    el.textContent = String(message);
}


function hideSaveProgress(){

    const el = $("saveProgress");

    if(el){
        el.style.display = "none";
    }

}


/* ============================================================
   SAFE LOAD
============================================================ */

function safeLoad(key, fallback){

    try{

        if(
            typeof window.localLoad === "function"
        ){

            const result =
                window.localLoad(
                    key,
                    fallback
                );

            if(result !== undefined){
                return result;
            }

        }

    }catch(e){

        console.warn(
            "localLoad failed:",
            key
        );

    }


    try{

        const raw =
            localStorage.getItem(key);

        if(raw === null){
            return fallback;
        }

        try{

            return JSON.parse(raw);

        }catch(e){

            return raw;

        }

    }catch(e){

        return fallback;

    }

}


/* ============================================================
   SAFE SAVE
============================================================ */

function safeSave(key,value){

    try{

        if(
            typeof window.localSave === "function"
        ){

            const result =
                window.localSave(
                    key,
                    value
                );

            if(result !== false){
                return true;
            }

        }

    }catch(e){

        console.warn(
            "localSave failed:",
            key
        );

    }


    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    }catch(e){

        console.error(
            "Local save failed:",
            key,
            e
        );

        return false;

    }

}


/* ============================================================
   CLOUD SAVE WITH TIMEOUT
   IMPORTANT:
   NEVER ALLOW CLOUD TO FREEZE SETTINGS PAGE
============================================================ */

async function cloudSave(key,value){

    /* Always save locally first */

    const localOK =
        safeSave(
            key,
            value
        );


    /*
     * No Firebase function:
     * local save is enough.
     */

    if(
        typeof window.firebaseSave !== "function"
    ){

        return localOK;
    }


    /*
     * Cloud save runs with timeout.
     */

    try{

        const cloudPromise =
            Promise.resolve(
                window.firebaseSave(
                    key,
                    value
                )
            );


        const timeoutPromise =
            new Promise(
                function(resolve){

                    setTimeout(
                        function(){

                            resolve(
                                "__TIMEOUT__"
                            );

                        },
                        CLOUD_TIMEOUT
                    );

                }
            );


        const result =
            await Promise.race([
                cloudPromise,
                timeoutPromise
            ]);


        if(result === "__TIMEOUT__"){

            console.warn(
                "Cloud save timeout:",
                key
            );

            status(
                "☁️ Saved locally • Cloud syncing...",
                true
            );

            /*
             * Do NOT throw.
             * Local data is already safe.
             */

            return localOK;
        }


        return result !== false;

    }catch(e){

        console.warn(
            "Cloud save skipped:",
            key,
            e
        );

        /*
         * Local copy is already saved.
         */

        return localOK;

    }

}

/* ============================================================
   IMAGE NORMALIZE
============================================================ */

function normalizeImageData(value){

    if(!value){
        return "";
    }

    let data =
        String(value).trim();


    if(
        (
            data.startsWith('"') &&
            data.endsWith('"')
        ) ||
        (
            data.startsWith("'") &&
            data.endsWith("'")
        )
    ){

        data =
            data.slice(
                1,
                -1
            );

    }


    data =
        data.replace(
            /\\"/g,
            '"'
        ).trim();


    if(
        /^(data:image\/|blob:|https?:\/\/)/i
            .test(data)
    ){

        return data;

    }


    return "";
}


/* ============================================================
   IMAGE BYTES
============================================================ */

function getDataUrlBytes(dataUrl){

    try{

        if(
            !dataUrl ||
            !String(dataUrl).startsWith("data:")
        ){
            return 0;
        }

        const base64 =
            String(dataUrl)
                .split(",")[1] || "";

        return Math.floor(
            base64.length * 0.75
        );

    }catch(e){

        return 0;

    }

}


/* ============================================================
   IMAGE COMPRESSION
============================================================ */

function compressImageSafe(
    file,
    maxW,
    maxH,
    callback
){

    if(!file){
        callback("");
        return;
    }


    if(
        !file.type ||
        !file.type.startsWith("image/")
    ){

        callback("");
        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const img =
                new Image();


            img.onload =
                function(){

                    try{

                        let w =
                            img.naturalWidth ||
                            img.width;

                        let h =
                            img.naturalHeight ||
                            img.height;


                        if(!w || !h){

                            callback("");
                            return;

                        }


                        const scale =
                            Math.min(
                                1,
                                maxW / w,
                                maxH / h
                            );


                        w =
                            Math.max(
                                1,
                                Math.round(w * scale)
                            );

                        h =
                            Math.max(
                                1,
                                Math.round(h * scale)
                            );


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width = w;
                        canvas.height = h;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        if(!ctx){

                            callback("");
                            return;

                        }


                        ctx.clearRect(
                            0,
                            0,
                            w,
                            h
                        );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            w,
                            h
                        );


                        let result = "";


                        /*
                         * WebP
                         */

                        try{

                            result =
                                canvas.toDataURL(
                                    "image/webp",
                                    0.72
                                );

                        }catch(e){

                            result = "";

                        }


                        /*
                         * JPEG fallback
                         */

                        if(
                            !result ||
                            !result.startsWith(
                                "data:image/"
                            )
                        ){

                            const jpeg =
                                document.createElement(
                                    "canvas"
                                );

                            jpeg.width = w;
                            jpeg.height = h;


                            const jctx =
                                jpeg.getContext(
                                    "2d"
                                );


                            jctx.fillStyle =
                                "#FFFFFF";

                            jctx.fillRect(
                                0,
                                0,
                                w,
                                h
                            );


                            jctx.drawImage(
                                img,
                                0,
                                0,
                                w,
                                h
                            );


                            result =
                                jpeg.toDataURL(
                                    "image/jpeg",
                                    0.70
                                );

                        }


                        /*
                         * Reduce quality if needed.
                         */

                        if(
                            getDataUrlBytes(result) >
                            MAX_IMAGE_BYTES
                        ){

                            const qualities = [
                                0.60,
                                0.50,
                                0.40,
                                0.30
                            ];


                            for(
                                const q of qualities
                            ){

                                try{

                                    const smaller =
                                        canvas.toDataURL(
                                            "image/webp",
                                            q
                                        );


                                    if(
                                        getDataUrlBytes(
                                            smaller
                                        ) <
                                        getDataUrlBytes(
                                            result
                                        )
                                    ){

                                        result =
                                            smaller;

                                    }


                                    if(
                                        getDataUrlBytes(
                                            result
                                        ) <=
                                        MAX_IMAGE_BYTES
                                    ){
                                        break;
                                    }

                                }catch(e){}

                            }

                        }


                        if(
                            getDataUrlBytes(result) >
                            MAX_IMAGE_BYTES
                        ){

                            alert(
                                "Image is too large.\n\nPlease select a smaller image."
                            );

                            callback("");
                            return;

                        }


                        callback(
                            normalizeImageData(
                                result
                            )
                        );


                    }catch(error){

                        console.error(
                            "Image error:",
                            error
                        );

                        callback("");

                    }

                };


            img.onerror =
                function(){
                    callback("");
                };


            img.src =
                e.target.result;

        };


    reader.onerror =
        function(){
            callback("");
        };


    reader.readAsDataURL(file);

}


/* ============================================================
   TOAST
============================================================ */

function toast(
    message,
    ok=true,
    callback
){

    try{

        const old =
            $("customToast");

        if(old){
            old.remove();
        }


        const t =
            document.createElement(
                "div"
            );


        t.id =
            "customToast";


        t.textContent =
            (ok ? "✅ " : "⚠️ ") +
            String(message);


        Object.assign(
            t.style,
            {
                position:"fixed",
                top:"15px",
                left:"50%",
                transform:"translateX(-50%)",
                background:
                    ok
                        ? "#059669"
                        : "#DC2626",
                color:"#fff",
                padding:"12px 18px",
                borderRadius:"9px",
                boxShadow:
                    "0 8px 20px rgba(0,0,0,.25)",
                zIndex:"999999",
                fontWeight:"700",
                fontSize:"12px",
                textAlign:"center",
                minWidth:"240px",
                maxWidth:"calc(100% - 20px)"
            }
        );


        document.body.appendChild(t);


        setTimeout(
            function(){

                if(
                    t &&
                    t.parentNode
                ){
                    t.remove();
                }


                if(callback){
                    callback();
                }

            },
            1300
        );


    }catch(e){

        if(callback){
            callback();
        }

    }

}

function loadDesignBitmap(designNo){

    const box =
        $("designBitmapPreviewBox");

    const img =
        $("designBitmapImgTag");


    if(!designNo){

        tempDesignBitmapData = "";

        if(box){
            box.style.display = "none";
        }

        return;
    }


    const specs =
        safeLoad(
            "design_specs",
            {}
        );


    if(
        !specs ||
        typeof specs !== "object"
    ){
        return;
    }


    const clean =
        String(designNo)
            .replace("#","")
            .trim()
            .toLowerCase();


    const key =
        Object.keys(specs)
            .find(
                function(k){

                    return String(k)
                        .replace("#","")
                        .trim()
                        .toLowerCase()
                        === clean;

                }
            ) ||
            designNo;


    const bitmap =
        normalizeImageData(
            specs[key] &&
            specs[key].bitmap
        );


    tempDesignBitmapData =
        bitmap;


    if(img && bitmap){

        img.src =
            bitmap;

        img.onload =
            function(){

                if(box){
                    box.style.display = "flex";
                }

            };

    }else{

        if(box){
            box.style.display = "none";
        }

    }

}

     */

        logo
    );


    if($("logoStatus")){

        $("logoStatus").textContent =
            "✅ Logo saved • " +
            Math.round(size / 1024) +
            " KB";

        $("logoStatus").style.color =
            "#4A7C59";

    }


    return true;

}


/* ============================================================
   SAVE ALL
============================================================ */

async function executeSaveAll(){

    if(saveAllRunning){
        return;
    }


    saveAllRunning =
        true;


    const button =
        $("saveAllButton");


    if(button){

        button.disabled =
            true;

        button.textContent =
            "⏳ SAVING...";

    }


    try{

        saveProgress(
            "Saving locally..."
        );


        status(
            "Saving settings..."
        );


        /*
         * GENERAL HEADING
         */

        const heading =
            cleanInputText(
                $("set_heading")
                    ? $("set_heading").value
                    : ""
            );


        const address =
            $("set_comp_addr")
                ? $("set_comp_addr").value
                : "";


        if(heading){

            safeSave(
                "app_heading_name",
                heading
            );

            await cloudSave(
                "app_heading_name",
                heading
            );

        }


        /*
         * ADDRESS
         */

        if(address.trim()){

            safeSave(
                "company_full_address",
                address
            );

            await cloudSave(
                "company_full_address",
                address
            );

        }


        /*
         * LOGO
         */

        if(tempLogoData){

            saveProgress(
                "Saving logo..."
            );


            await saveCompanyLogoSafely();

        }


        /*
         * DESIGN BITMAP
         */

        const designSelect =
            $("settingDesignSelect");


        if(
            designSelect &&
            designSelect.value &&
            tempDesignBitmapData
        ){

            saveProgress(
                "Saving design bitmap..."
            );


            const specs =
                safeLoad(
                    "design_specs",
                    {}
                );


            const clean =
                String(
                    designSelect.value
                )
                .replace("#","")
                .trim()
                .toLowerCase();


            const key =
                Object.keys(specs)
                    .find(
                        function(k){

                            return String(k)
                                .replace("#","")
                                .trim()
                                .toLowerCase()
                                === clean;

                        }
                    ) ||
                    designSelect.value;


            if(
                !specs[key] ||
                typeof specs[key] !== "object"
            ){
                specs[key] = {};
            }


            specs[key].bitmap =
                normalizeImageData(
                    tempDesignBitmapData
                );


            safeSave(
                "design_specs",
                specs
            );


            await cloudSave(
                "design_specs",
                specs
            );

        }


        saveProgress(
            "Settings saved successfully."
        );


        status(
            "✅ Settings saved successfully",
            true
        );


        toast(
            "All Settings Saved!",
            true,
            function(){

                /*
                 * Small delay avoids mobile browser
                 * navigation during active paint.
                 */

                setTimeout(
                    function(){

                        window.location.href =
                            "dashboard.html";

                    },
                    50
                );

            }
        );


    }catch(e){

        console.error(
            "Save All Error:",
            e
        );


        status(
            "❌ Save failed",
            false
        );


        hideSaveProgress();


        alert(
            "Save Error:\n\n" +
            e.message +
            "\n\nLocal data is protected."
        );


    }finally{

        saveAllRunning =
            false;


        if(button){

            button.disabled =
                false;

            button.textContent =
                "✅ Save All Settings & Exit";

        }

    }

}


/* ============================================================
   CLEAR LOCAL CACHE
============================================================ */

async function clearLocalCacheSafe(){

    if(
        typeof window.handleLocalReset ===
        "function"
    ){

        try{

            await Promise.race([
                Promise.resolve(
                    window.handleLocalReset()
                ),
                new Promise(
                    function(resolve){
                        setTimeout(
                            resolve,
                            5000
                        );
                    }
                )
            ]);

        }catch(e){

            console.warn(
                "Local reset error:",
                e
            );

        }

        return;
    }


    /*
     * Do not call window.clearLocalCache()
     * because this page itself owns that name.
     */

    if(
        !confirm(
            "Clear local cache?\n\nThis may remove local ERP data."
        )
    ){
        return;
    }


    try{

        localStorage.clear();

        toast(
            "Local cache cleared.",
            true,
            function(){

                location.reload();

            }
        );

    }catch(e){

        alert(
            "Clear cache failed:\n" +
            e.message
        );

    }

}

/* ============================================================
   BACKUP
============================================================ */

function backupAllData(){

    try{

        const allData = {};

        const length =
            localStorage.length;


        /*
         * Protect against extremely large backup.
         */

        for(
            let i=0;
            i<length;
            i++
        ){

            const key =
                localStorage.key(i);

            if(!key){
                continue;
            }


            allData[key] =
                localStorage.getItem(key);

        }


        const payload = {

            app:"TEXFRIEND ERP",

            version:"Settings Backup",

            createdAt:
                new Date().toISOString(),

            data:allData

        };


        const json =
            JSON.stringify(
                payload
            );


        const blob =
            new Blob(
                [json],
                {
                    type:"application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href = url;

        a.download =
            "texfriend_erp_backup_" +
            new Date()
                .toISOString()
                .slice(0,10) +
            ".json";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        toast(
            "Backup download started."
        );


    }catch(e){

        console.error(
            "Backup error:",
            e
        );


        alert(
            "Backup Error:\n" +
            e.message
        );

    }

}


/* ============================================================
   LOAD JSON EDITOR
   LARGE DATA PROTECTION
============================================================ */

function loadStorageDataToEditor(){

    const editor =
        $("advancedJsonEditor");


    if(!editor){
        return;
    }


    try{

        const allData = {};


        for(
            let i=0;
            i<localStorage.length;
            i++
        ){

            const key =
                localStorage.key(i);

            if(key){

                allData[key] =
                    localStorage.getItem(key);

            }

        }


        const json =
            JSON.stringify(
                allData,
                null,
                2
            );


        /*
         * Prevent mobile browser from locking
         * when LocalStorage is extremely large.
         */

        if(
            json.length >
            MAX_EDITOR_BYTES
        ){

            editor.value =
                "⚠️ DATA TOO LARGE FOR MOBILE JSON EDITOR.\n\n" +
                "Total size: " +
                Math.round(
                    json.length / 1024
                ) +
                " KB\n\n" +
                "Use Backup Entire ERP Data instead.";

            toast(
                "Database is too large for mobile editor.",
                false
            );

            return;
        }


        editor.value =
            json;


        toast(
            "Database loaded into editor."
        );


    }catch(e){

        alert(
            "JSON Load Error:\n" +
            e.message
        );

    }

}


/* ============================================================
   SAVE JSON EDITOR
============================================================ */

async function saveStorageDataFromEditor(){

    const editor =
        $("advancedJsonEditor");


    if(!editor){
        return;
    }


    const text =
        editor.value.trim();


    if(!text){

        toast(
            "JSON editor is empty.",
            false
        );

        return;
    }


    if(
        text.length >
        MAX_EDITOR_BYTES
    ){

        toast(
            "JSON data is too large for mobile save.",
            false
        );

        return;
    }


    let parsed;


    try{

        parsed =
            JSON.parse(text);

    }catch(e){

        alert(
            "Invalid JSON format:\n\n" +
            e.message
        );

        return;
    }


    if(
        !parsed ||
        typeof parsed !== "object" ||
        Array.isArray(parsed)
    ){

        alert(
            "JSON root must be an object."
        );

        return;
    }


    if(
        !confirm(
            "Overwrite local database with these JSON changes?"
        )
    ){
        return;
    }


    try{

        /*
         * LOCAL FIRST
         */

        Object.keys(parsed)
            .forEach(
                function(key){

                    const value =
                        parsed[key];


                    localStorage.setItem(
                        key,
                        typeof value === "string"
                            ? value
                            : JSON.stringify(value)
                    );

                }
            );


        /*
         * Cloud sync only for configured keys.
         * Each save has timeout protection.
         */

        if(
            typeof window.firebaseSave ===
            "function"
        ){

            const keys =
                Array.isArray(
                    window.erpCloudKeys
                )
                    ? window.erpCloudKeys
                    : [];


            for(
                const key of keys
            ){

                if(
                    !(key in parsed)
                ){
                    continue;
                }


                let value =
                    parsed[key];


                if(
                    typeof value === "string"
                ){

                    try{

                        value =
                            JSON.parse(
                                value
                            );

                    }catch(e){}

                }


                await cloudSave(
                    key,
                    value
                );

            }

        }


        toast(
            "Database updated successfully.",
            true,
            function(){

                location.reload();

            }
        );


    }catch(e){

        console.error(
            "JSON Save Error:",
            e
        );


        alert(
            "Database Save Error:\n" +
            e.message
        );

    }

}


/* ============================================================
   INITIALISE
============================================================ */

function initialiseSettings(){

    if(settingsInitialized){
        return;
    }


    settingsInitialized =
        true;


    /*
     * Permission check
     */

    if(!checkUserPermission()){

        alert(
            "Access Denied! ❌"
        );


        location.href =
            "dashboard.html";


        return;
    }


    /*
     * Heading
     */

    const heading =
        safeLoad(
            "app_heading_name",
            "TEXFRIEND ERP"
        );


    if($("set_heading")){

        $("set_heading").value =
            cleanInputText(
                heading
            );

    }


    /*
     * Address
     */

    const address =
        safeLoad(
            "company_full_address",
            "TEXFRIEND ERP SOLUTIONS\nSalem, Tamil Nadu."
        );


    if($("set_comp_addr")){

        $("set_comp_addr").value =
            String(
                address || ""
            )
            .replace(
                /\\n/g,
                "\n"
            );

    }


    /*
     * Logo
     */

    tempLogoData =
        getStoredCompanyLogo();


    showCompanyLogo(
        tempLogoData
    );


    /*
     * Load basic local data.
     */

    loadDesignDropdownInSettings();

    loadPartyDropdown();

    loadUserPermissions();

    renderUsersTable();


    status(
        "☁️ Settings ready"
    );

}


/* ============================================================
   SAFE CLOUD REFRESH
============================================================ */

function refreshSettingsFromLocal(){

    try{

        loadDesignDropdownInSettings();

        loadPartyDropdown();

        loadUserPermissions();

        renderUsersTable();


        const logo =
            getStoredCompanyLogo();


        if(logo){

            tempLogoData =
                logo;

            showCompanyLogo(
                logo
            );

        }


    }catch(e){

        console.warn(
            "Refresh warning:",
            e
        );

    }

}


/* ============================================================
   DOM READY
============================================================ */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
         * IMPORTANT:
         * Settings opens immediately.
         * It does NOT wait for Firebase.
         */

        initialiseSettings();


        /*
         * Cloud sync event.
         * Handle only once.
         */

        window.addEventListener(
            "texfriend-cloud-sync-complete",
            function(){

                if(cloudSyncHandled){
                    return;
                }


                cloudSyncHandled =
                    true;


                /*
                 * Defer heavy refresh until browser
                 * finishes current paint.
                 */

                setTimeout(
                    function(){

                        refreshSettingsFromLocal();

                        status(
                            "☁️ Cloud data synchronized"
                        );

                    },
                    50
                );

            },
            {
                once:true
            }
        );


    },
    {
        once:true
    }
);


/* ============================================================
   PREVENT DOUBLE TOUCH / ACCIDENTAL FORM SUBMIT
============================================================ */

document.addEventListener(
    "submit",
    function(e){
        e.preventDefault();
    }
);


/* ============================================================
   PAGE VISIBILITY SAFETY
============================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            /*
             * Small non-blocking refresh.
             */

            setTimeout(
                function(){

                    if(
                        settingsInitialized
                    ){

                        refreshSettingsFromLocal();

                    }

                },
                100
            );

        }

    }
);

</script>
