<script>
"use strict";

/* =========================================================
   MOBILE SAFE SETTINGS V2
========================================================= */

let tempLogoData = "";
let tempDesignBitmapData = "";
let settingsReady = false;
let saving = false;

const MAX_IMAGE_BYTES = 300 * 1024;


/* =========================================================
   HELPER
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,ok=true){

    const el = $("settingsStatus");

    if(!el) return;

    el.textContent = text;

    el.style.color =
        ok ? "#2563EB" : "#DC2626";
}


function progress(text){

    const el = $("saveProgress");

    if(!el) return;

    el.style.display = "block";
    el.textContent = text;
}


function hideProgress(){

    const el = $("saveProgress");

    if(el){
        el.style.display = "none";
    }

}


/* =========================================================
   SAFE LOAD
========================================================= */

function safeLoad(key,fallback){

    try{

        if(typeof window.localLoad === "function"){

            const value =
                window.localLoad(key,fallback);

            return value == null
                ? fallback
                : value;
        }

        const raw =
            localStorage.getItem(key);

        if(raw === null)
            return fallback;

        try{
            return JSON.parse(raw);
        }catch(e){
            return raw;
        }

    }catch(e){

        console.warn("safeLoad:",key,e);

        return fallback;
    }
}


/* =========================================================
   SAFE SAVE
========================================================= */

function safeSave(key,value){

    try{

        if(typeof window.localSave === "function"){

            return window.localSave(key,value);
        }

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    }catch(e){

        console.warn("safeSave:",key,e);

        return false;
    }
}


/* =========================================================
   CLOUD SAVE
   NEVER BLOCK PAGE
========================================================= */

async function cloudSaveSafe(key,value){

    try{

        if(typeof window.firebaseSave === "function"){

            const result =
                await Promise.race([
                    Promise.resolve(
                        window.firebaseSave(key,value)
                    ),
                    new Promise(resolve =>
                        setTimeout(
                            () => resolve(true),
                            5000
                        )
                    )
                ]);

            safeSave(key,value);

            return result !== false;
        }

    }catch(e){

        console.warn(
            "Cloud save fallback:",
            key,
            e
        );
    }

    return safeSave(key,value);
}


/* =========================================================
   TEXT
========================================================= */

function cleanText(value){

    return value == null
        ? ""
        : String(value).trim();
}


/* =========================================================
   TOAST
========================================================= */

function toast(message,ok=true){

    const old =
        document.querySelector(".toast");

    if(old)
        old.remove();

    const el =
        document.createElement("div");

    el.className = "toast";

    el.style.background =
        ok ? "#059669" : "#DC2626";

    el.textContent =
        (ok ? "✅ " : "⚠️ ") + message;

    document.body.appendChild(el);

    setTimeout(() => {

        if(el.parentNode)
            el.remove();

    },2200);
}


/* =========================================================
   IMAGE SIZE
========================================================= */

function imageBytes(data){

    if(!data || !data.startsWith("data:"))
        return 0;

    const base64 =
        data.split(",")[1] || "";

    return Math.floor(
        base64.length * 0.75
    );
}


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(file,maxSize,callback){

    if(!file || !file.type.startsWith("image/")){

        callback("");

        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        const img =
            new Image();

        img.onload = function(){

            try{

                let w =
                    img.naturalWidth;

                let h =
                    img.naturalHeight;

                const scale =
                    Math.min(
                        1,
                        maxSize / w,
                        maxSize / h
                    );

                w =
                    Math.max(
                        1,
                        Math.round(w * scale)
                    );

                h =
                    Math.max(
                        1,
                        Math.round(h * scale)
                    );

                const canvas =
                    document.createElement("canvas");

                canvas.width = w;
                canvas.height = h;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    w,
                    h
                );

                let result =
                    canvas.toDataURL(
                        "image/webp",
                        .72
                    );

                if(
                    !result ||
                    imageBytes(result) >
                    MAX_IMAGE_BYTES
                ){

                    result =
                        canvas.toDataURL(
                            "image/jpeg",
                            .65
                        );
                }

                if(
                    imageBytes(result) >
                    MAX_IMAGE_BYTES
                ){

                    result =
                        canvas.toDataURL(
                            "image/jpeg",
                            .45
                        );
                }

                if(
                    imageBytes(result) >
                    MAX_IMAGE_BYTES
                ){

                    callback("");

                    return;
                }

                callback(result);

            }catch(err){

                console.error(err);

                callback("");
            }

        };

        img.onerror = () => callback("");

        img.src = e.target.result;
    };

    reader.onerror = () => callback("");

    reader.readAsDataURL(file);
}


/* =========================================================
   LOGO
========================================================= */

function getLogo(){

    const keys = [
        "company_logo",
        "company_logo_base64",
        "logo"
    ];

    for(const key of keys){

        try{

            let value =
                localStorage.getItem(key);

            if(!value)
                continue;

            try{
                value = JSON.parse(value);
            }catch(e){}

            if(
                typeof value === "string" &&
                value.startsWith("data:image/")
            ){
                return value;
            }

        }catch(e){}
    }

    return "";
}


function showLogo(data){

    const img = $("logoImgTag");
    const box = $("logoPreviewBox");

    if(!img || !box)
        return;

    if(!data){

        box.style.display = "none";

        img.removeAttribute("src");

        return;
    }

    img.onload = () => {

        box.style.display = "flex";

    };

    img.onerror = () => {

        box.style.display = "none";

        img.removeAttribute("src");
    };

    img.src = data;
}


/* =========================================================
   LOGO FILE EVENT
========================================================= */

$("set_logo_file").addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];

        if(!file)
            return;

        progress("Optimizing logo...");

        compressImage(
            file,
            512,
            function(result){

                hideProgress();

                if(!result){

                    toast(
                        "Logo compression failed",
                        false
                    );

                    return;
                }

                tempLogoData = result;

                showLogo(result);

                $("logoStatus").textContent =
                    "Optimized: " +
                    Math.round(
                        imageBytes(result)/1024
                    ) +
                    " KB";

                $("logoStatus").style.color =
                    "#059669";
            }
        );
    }
);


/* =========================================================
   DESIGN FILE
========================================================= */

$("designBitmapFile").addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];

        if(!file)
            return;

        progress("Optimizing design image...");

        compressImage(
            file,
            700,
            function(result){

                hideProgress();

                if(!result){

                    toast(
                        "Design image compression failed",
                        false
                    );

                    return;
                }

                tempDesignBitmapData =
                    result;

                const img =
                    $("designBitmapImgTag");

                const box =
                    $("designBitmapPreviewBox");

                img.src = result;

                box.style.display =
                    "flex";
            }
        );
    }
);


/* =========================================================
   PERMISSIONS
========================================================= */

const permissionKeys = [
    "dashboard",
    "design_list",
    "design_master",
    "despatch",
    "dyeing_issue",
    "dyeing_receive",

/* =========================================================
   USERS
========================================================= */

function getUsers(){

    const data =
        safeLoad(
            "erp_system_users",
            []
        );

    return Array.isArray(data)
        ? data
        : [];
}


function renderUsers(){

    const body =
        $("usersTableBody");

    if(!body)
        return;

    body.innerHTML = "";

    const users =
        getUsers();

    users.forEach((user,index) => {

        const tr =
            document.createElement("tr");

        const values = [
            user.username,
            user.password,
            user.role
        ];

        values.forEach(value => {

            const td =
                document.createElement("td");

            td.textContent =
                value || "";

            tr.appendChild(td);
        });

        const td =
            document.createElement("td");

        const btn =
            document.createElement("button");

        btn.className =
            "btn red";

        btn.style.minHeight =
            "30px";

        btn.style.fontSize =
            "9px";

        btn.textContent =
            "Delete";

        btn.onclick =
            () => deleteUser(index);

        td.appendChild(btn);

        tr.appendChild(td);

        body.appendChild(tr);
    });
}


async function addNewUserAccount(){

    const username =
        cleanText(
            $("newUsername").value
        );

    const password =
        cleanText(
            $("newPassword").value
        );

    const role =
        $("newUserRole").value;

    if(!username || !password){

        toast(
            "Enter username and password",
            false
        );

        return;
    }

    const users =
        getUsers();

    if(
        users.some(
            u =>
                String(u.username)
                .toLowerCase() ===
                username.toLowerCase()
        )
    ){

        toast(
            "Username already exists",
            false
        );

        return;
    }

    users.push({
        username,
        password,
        role
    });

    safeSave(
        "erp_system_users",
        users
    );

    cloudSaveSafe(
        "erp_system_users",
        users
    );

    $("newUsername").value = "";
    $("newPassword").value = "";

    renderUsers();

    toast(
        "New user created"
    );
}


async function deleteUser(index){

    if(!confirm("Delete this user?"))
        return;

    const users =
        getUsers();

    users.splice(index,1);

    safeSave(
        "erp_system_users",
        users
    );

    cloudSaveSafe(
        "erp_system_users",
        users
    );

    renderUsers();

    toast(
        "User deleted"
    );
}


/* =========================================================
   DESIGN DROPDOWN
========================================================= */

function loadDesignDropdown(){

    const select =
        $("settingDesignSelect");

    if(!select)
        return;

    const set =
        new Set();

    const sources = [
        safeLoad("pre_design_numbers",[]),
        safeLoad("design_masters_data",[]),
        safeLoad("party_orders_data",[])
    ];

    sources.forEach(list => {

        if(!Array.isArray(list))
            return;

        list.forEach(item => {

            let value = "";

            if(typeof item === "string"){

                value = item;

            }else if(item){

                value =
                    item.designNo ||
                    item.designNumber ||
                    item.name ||
                    "";
            }

            if(value)
                set.add(String(value));
        });
    });

    const specs =
        safeLoad(
            "design_specs",
            {}
        ) || {};

    if(
        specs &&
        typeof specs === "object"
    ){

        Object.keys(specs).forEach(key => {

            if(key)
                set.add(key);
        });
    }

    select.innerHTML =
        '<option value="">Select Design Number</option>';

    Array.from(set)
        .sort()
        .forEach(value => {

            const option =
                document.createElement("option");

            option.value = value;
            option.textContent = value;

            select.appendChild(option);
        });
}


/* =========================================================
   DESIGN LOAD
========================================================= */

$("settingDesignSelect").addEventListener(
    "change",
    function(){

        const designNo =
            this.value;

        const box =
            $("designBitmapPreviewBox");

        const img =
            $("designBitmapImgTag");

        tempDesignBitmapData = "";

        if(!designNo){

            box.style.display = "none";

            return;
        }

        const specs =
            safeLoad(
                "design_specs",
                {}
            ) || {};

        const key =
            Object.keys(specs)
            .find(
                k =>
                    String(k)
                    .trim()
                    .toLowerCase() ===
                    String(designNo)
                    .trim()
                    .toLowerCase()
            );

        const data =
            key &&
            specs[key]
                ? specs[key].bitmap
                : "";

        if(
            data &&
            String(data).startsWith("data:image/")
        ){

            tempDesignBitmapData =
                data;

            img.src = data;

            box.style.display =
                "flex";

        }else{

            box.style.display =
                "none";
        }
    }
);

async function savePartyMaster(){

        cleanText(
            $("partyNameInput").value

    if(!name){

        toast(
            "Enter Party Name",
            false
        );

        return;
    }

    const db =
        getPartyDB();

    db[name] =
        address;

    safeSave(
        "party_master_db",
        db
    );

    safeSave(
        "party_master_list",
        Object.keys(db)
    );

    cloudSaveSafe(
        "party_master_db",
        db
    );

    cloudSaveSafe(
        "party_master_list",
        Object.keys(db)
    );

    loadParties();

    $("partyListSelect").value =
        name;

    toast(
        "Party saved"
    );
}


async function deletePartyMaster(){

    const name =
        $("partyListSelect").value;

    if(!name){

        toast(
            "Select a party first",
            false
        );

        return;
    }

    if(!confirm("Delete "+name+"?"))
        return;

    const db =
        getPartyDB();

    delete db[name];

    safeSave(
        "party_master_db",
        db
    );

    safeSave(
        "party_master_list",
        Object.keys(db)
    );

    cloudSaveSafe(
        "party_master_db",
        db
    );

    cloudSaveSafe(
        "party_master_list",
        Object.keys(db)
    );

    $("partyNameInput").value = "";
    $("partyAddressInput").value = "";

    loadParties();

    toast(

}


/* =========================================================
   SAVE ALL
========================================================= */

async function executeSaveAll(){

    if(saving)
        return;

    saving = true;

    const button =
        $("saveAllButton");

    button.disabled = true;

    try{

        progress(
            "Saving settings..."
        );

        const heading =
            cleanText(
                $("set_heading").value
            );

        const address =
            $("set_comp_addr")
            .value
            .trim();

        if(heading){

            safeSave(
                "app_heading_name",
                heading
            );

            cloudSaveSafe(
                "app_heading_name",
                heading
            );
        }

        safeSave(
            "company_full_address",
            address
        );

        cloudSaveSafe(
            "company_full_address",
            address
        );


        /* LOGO */

        if(tempLogoData){

            safeSave(
                "company_logo",
                tempLogoData
            );

            safeSave(
                "company_logo_base64",
                tempLogoData
            );

            safeSave(
                "logo",
                tempLogoData
            );

            cloudSaveSafe(
                "company_logo",
                tempLogoData
            );
        }


        /* DESIGN BITMAP */

        const design =
            $("settingDesignSelect").value;

        if(
            design &&
            tempDesignBitmapData
        ){

            const specs =
                safeLoad(
                    "design_specs",
                    {}
                ) || {};

            const key =
                Object.keys(specs)
                .find(
                    k =>
                        String(k)
                        .trim()
                        .toLowerCase() ===
                        String(design)
                        .trim()
                        .toLowerCase()
                ) || design;

            if(
                !specs[key] ||
                typeof specs[key] !== "object"
            ){

                specs[key] = {};
            }

            specs[key].bitmap =
                tempDesignBitmapData;

            safeSave(
                "design_specs",
                specs
            );

            cloudSaveSafe(
                "design_specs",
                specs
            );
        }


        hideProgress();

        setStatus(
            "✅ All settings saved successfully"
        );

        toast(
            "Settings saved successfully"
        );

        /*
         * IMPORTANT:
         * NO REDIRECT.
         * User remains on Settings page.
         */

    }catch(error){

        console.error(
            "Save All Error:",
            error
        );

        hideProgress();

        setStatus(
            "❌ Save failed",
            false
        );

        toast(
            "Save failed: "+error.message,
            false
        );

    }finally{

        saving = false;

        button.disabled = false;
    }
}


/* =========================================================
   BACKUP
========================================================= */

function backupAllData(){

    try{

        const data = {};

        for(
            let i=0;
            i<localStorage.length;
            i++
        ){

            const key =
                localStorage.key(i);

            data[key] =
                localStorage.getItem(key);
        }

        const payload = {
            app:"TEXFRIEND ERP",
            createdAt:new Date().toISOString(),
            data:data
        };

        const blob =
            new Blob(
                [
                    JSON.stringify(
                        payload,
                        null,
                        2
                    )
                ],
                {
                    type:"application/json"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "texfriend_erp_backup.json";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(
            () =>
                URL.revokeObjectURL(url),
            1000
        );

        toast(
            "Backup download started"
        );

    }catch(e){

        toast(
            "Backup failed",
            false
        );
    }
}


/* =========================================================
   JSON EDITOR
========================================================= */

function loadStorageDataToEditor(){

    const data = {};

    for(
        let i=0;
        i<localStorage.length;
        i++
    ){

        const key =
            localStorage.key(i);

        data[key] =
            localStorage.getItem(key);
    }

    $("advancedJsonEditor").value =
        JSON.stringify(
            data,
            null,
            2
        );

    toast(
        "Local data loaded"
    );
}


async function saveStorageDataFromEditor(){

    const editor =
        $("advancedJsonEditor");

    let data;

    try{

        data =
            JSON.parse(
                editor.value
            );

    }catch(e){

        toast(
            "Invalid JSON",
            false
        );

        return;
    }

    if(
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ){

        toast(
            "JSON root must be an object",
            false
        );

        return;
    }

    if(
        !confirm(
            "Overwrite local database with this JSON?"
        )
    )
        return;

    try{

        Object.keys(data)
        .forEach(key => {

            const value =
                data[key];

            localStorage.setItem(
                key,
                typeof value === "string"
                    ? value
                    : JSON.stringify(value)
            );
        });

        toast(
            "Database updated"
        );

    }catch(e){

        toast(
            "Database update failed",
            false
        );
    }
}


/* =========================================================
   CLEAR CACHE
========================================================= */

async function clearLocalCacheSafe(){

    if(
        typeof window.handleLocalReset ===
        "function"
    ){

        try{
            await window.handleLocalReset();
            return;
        }catch(e){
            console.warn(e);
        }
    }

    if(
        !confirm(
            "Clear local cache?"
        )
    )
        return;

    try{

        localStorage.clear();

        toast(
            "Local cache cleared"
        );

        setTimeout(
            () => location.reload(),
            800
        );

    }catch(e){

        toast(
            "Clear cache failed",
            false
        );
    }
}

========================================================= */

async function factoryResetCloudSafe(){

    if(
        !confirm(
            "⚠️ Factory Reset Cloud?\n\nThis may delete cloud data."
        )
    )
        return;

    if(
        typeof window.handleCloudReset ===
        "function"
    ){

        try{

            await window.handleCloudReset();

            return;

        }catch(e){

            console.error(e);
        }
    }

    toast(
        "Cloud reset function is not available",
        false
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

function initialiseSettings(){

    if(settingsReady)
        return;

    settingsReady = true;


    /*
     * IMPORTANT:
     *
     * We DO NOT redirect here.
     * This prevents the mobile Settings → Dashboard loop.
     */


    const heading =
        safeLoad(
            "app_heading_name",
            "TEXFRIEND ERP"
        );

    $("set_heading").value =
        cleanText(heading);


    const address =
        safeLoad(
            "company_full_address",
            ""
        );

    $("set_comp_addr").value =
        String(address || "")
        .replace(/\\n/g,"\n");


    tempLogoData =
        getLogo();

    if(tempLogoData){

        showLogo(tempLogoData);

        $("logoStatus").textContent =
            "Saved company logo";
    }


    loadPermissions();

    renderUsers();

    loadDesignDropdown();

    loadParties();


    setStatus(
        "☁️ Settings ready"
    );
}


/* =========================================================
   DOM READY
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
         * Small delay prevents mobile browser from doing
         * everything in the first rendering frame.
         */

        setTimeout(
            initialiseSettings,
            50
        );

    },
    {once:true}
);


/* =========================================================
   CLOUD SYNC
   NON-BLOCKING / ONE-TIME REFRESH
========================================================= */

let cloudRefreshDone = false;

window.addEventListener(
    "texfriend-cloud-sync-complete",
    function(){

        if(cloudRefreshDone)
            return;

        cloudRefreshDone = true;

        /*
         * Do not rebuild the whole page.
         * Only refresh small lists.
         */

        setTimeout(
            function(){

                try{

                    loadDesignDropdown();

                    loadParties();

                    loadPermissions();

                    renderUsers();

                    const logo =
                        getLogo();

                    if(logo){

                        tempLogoData =
                            logo;

                        showLogo(logo);
                    }

                    setStatus(
                        "☁️ Cloud data synchronized"
                    );

                }catch(e){

                    console.warn(
                        "Cloud UI refresh:",
                        e
                    );
                }

            },
            300
        );
    }
);
